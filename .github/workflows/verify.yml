name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hirelens_test
          POSTGRES_PASSWORD: hirelens_test
          POSTGRES_DB: hirelens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hirelens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hirelens_test:hirelens_test@localhost:5432/hirelens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: python -m venv apps/ml-service/.venv
      - run: apps/ml-service/.venv/bin/pip install -r apps/ml-service/requirements-test.txt
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run verify
  clean-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/ml-service/Dockerfile.smoke -t hirelens-smoke .
      - run: docker run --rm hirelens-smoke
