name: Evaluation
# Quality gate for changes that can move the model's answers: the prompt, inference code, the
# output schema, retrieval and the evaluation itself. Runs the `ci` subset of the hand-written
# cases against the hosted model and fails on a flagged case, a counterfactual gap or a drop in
# quoted claims. A manual run can evaluate every case and record it in EVALUATION.md.
#
# Needs the repository secret OPENAI_API_KEY (Settings -> Secrets and variables -> Actions).
# Without it (forks, or before it is added) the job explains why and skips.
on:
  pull_request:
    paths:
      - apps/ml-service/inference/**
      - apps/ml-service/rag/**
      - apps/ml-service/eval/**
      - apps/ml-service/common.py
      - apps/ml-service/requirements.txt
      - packages/shared/analysis.schema.json
      - .github/workflows/eval.yml
  workflow_dispatch:
    inputs:
      cases:
        description: "ci (the pull-request subset) or all"
        type: choice
        options: [all, ci]
        default: all
      repeat:
        description: "Runs per case (1-5)"
        type: choice
        options: ["1", "2", "3", "5"]
        default: "2"
      record:
        description: "Commit the result to eval/history and EVALUATION.md"
        type: boolean
        default: true

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # only used by a recorded manual run
      pull-requests: write   # the summary comment
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hirelens
          POSTGRES_PASSWORD: hirelens
          POSTGRES_DB: hirelens
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hirelens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MODEL_BACKEND: hosted
      HOSTED_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://hirelens:hirelens@localhost:5432/hirelens
      PGPASSWORD: hirelens
      APP_ENV: ci
    defaults:
      run:
        working-directory: apps/ml-service
    steps:
      - name: Check for the provider key
        id: key
        working-directory: .
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY is not set for this repository, so the evaluation was skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ml-service/requirements.txt
      - name: Install (no local model runtime; CPU-only PyTorch for the embedder)
        if: steps.key.outputs.present == 'true'
        run: |
          grep -v -e '^llama-cpp-python' -e '^mangum' requirements.txt > /tmp/requirements-eval.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r /tmp/requirements-eval.txt
      - name: Database schema and knowledge base
        if: steps.key.outputs.present == 'true'
        run: |
          for migration in ../api/prisma/migrations/*/migration.sql; do
            psql -h localhost -U hirelens -d hirelens -v ON_ERROR_STOP=1 -q -f "$migration"
          done
          python -m rag.ingest
      - name: Evaluate
        if: steps.key.outputs.present == 'true'
        id: eval
        run: |
          cases="${{ github.event_name == 'workflow_dispatch' && inputs.cases || 'ci' }}"
          repeat="${{ github.event_name == 'workflow_dispatch' && inputs.repeat || '1' }}"
          record="${{ github.event_name == 'workflow_dispatch' && inputs.record && '--record' || '' }}"
          set +e
          python -m eval.run_eval --direct --cases "$cases" --repeat "$repeat" $record \
            --summary eval-summary.json --markdown eval-summary.md | tee eval-output.txt
          status=${PIPESTATUS[0]}
          set -e
          cat eval-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Comment on the pull request
        if: steps.key.outputs.present == 'true' && github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f eval-summary.md ] || exit 0
          gh pr comment "${{ github.event.pull_request.number }}" --body-file eval-summary.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file eval-summary.md
      - name: Record the run
        if: steps.key.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.record
        run: |
          python -m eval.dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/history ../../EVALUATION.md
          git commit -m "Record evaluation run (${{ inputs.cases }} x${{ inputs.repeat }})" && git push
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true' && always()
        with:
          name: evaluation
          path: |
            apps/ml-service/eval-summary.json
            apps/ml-service/eval-summary.md
            apps/ml-service/eval-output.txt
      - name: Gate
        if: steps.key.outputs.present == 'true'
        run: exit "${{ steps.eval.outputs.status }}"

  dashboard-current:
    # EVALUATION.md must match eval/history (no network or key needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m eval.dashboard --check
        working-directory: apps/ml-service
