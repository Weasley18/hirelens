name: Fairness audit
# Runs eval/fairness_audit.py against the hosted model and commits the report (FAIRNESS.md,
# eval/fairness/latest.json and the summary in EVALUATION.md). Manual only: with the defaults it
# makes 264 model calls, about $0.30 on gpt-6-luna. Needs the OPENAI_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Analyses per variant (132 variants)"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "2"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hirelens
          POSTGRES_PASSWORD: hirelens
          POSTGRES_DB: hirelens
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hirelens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MODEL_BACKEND: hosted
      HOSTED_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://hirelens:hirelens@localhost:5432/hirelens
      PGPASSWORD: hirelens
      APP_ENV: ci
    defaults:
      run:
        working-directory: apps/ml-service
    steps:
      - name: Require the provider key
        working-directory: .
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo "::error::Add the OPENAI_API_KEY repository secret first."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ml-service/requirements.txt
      - run: |
          grep -v -e '^llama-cpp-python' -e '^mangum' requirements.txt > /tmp/requirements-eval.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r /tmp/requirements-eval.txt
      - run: |
          for migration in ../api/prisma/migrations/*/migration.sql; do
            psql -h localhost -U hirelens -d hirelens -v ON_ERROR_STOP=1 -q -f "$migration"
          done
          python -m rag.ingest
      - run: python -m eval.fairness_audit --repeat "${{ inputs.repeat }}" --workers 6
      - run: |
          python -m eval.dashboard
          cat ../../FAIRNESS.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/fairness ../../FAIRNESS.md ../../EVALUATION.md
          git commit -m "Record fairness audit (x${{ inputs.repeat }})" && git push
