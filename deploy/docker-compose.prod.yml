# Single-VM production layout: API, worker, ML service, Redis and Caddy (HTTPS), built and run on
# the VM (needs ~2 GB of RAM; an Oracle Ampere A1 VM with 6 GB is plenty). The ML service calls the
# hosted model provider and is reachable only on the private network. The web app goes on a static
# host; see DEPLOYMENT.md. With ML_LAMBDA_FUNCTION set, the worker uses Lambda instead.
#
#   cp deploy/production.env.example deploy/production.env   # fill in, never commit
#   cp deploy/ml.env.example deploy/ml.env                   # provider key, never commit
#   bash deploy/update.sh                                     # build, migrate, start
#
# Postgres is expected to be managed (Neon, Supabase, RDS) with pgvector available.
# Redis runs here, private to this network, with persistence disabled on purpose: it holds
# candidate documents and results that must disappear on expiry (see SECURITY.md).

# The API and worker run the same image. Only the api service builds it: if both declared a
# build, Compose would build the image twice in parallel and fail on the shared tag.
x-app: &app
  image: hirelens-api:${APP_REVISION:?set APP_REVISION to the git commit you are deploying}
  env_file: production.env
  environment:
    NODE_ENV: production
    REDIS_URL: redis://redis:6379
    ML_SERVICE_URL: http://ml:8000
    # Traces go to the Jaeger service below. Set OTEL_EXPORTER_OTLP_ENDPOINT= (empty) in
    # production.env to turn tracing off, or to another OTLP/HTTP collector to send them there.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
    # The root filesystem is read-only; Chromium (PDF reports) keeps its profile and caches in /tmp.
    HOME: /tmp
    XDG_CONFIG_HOME: /tmp
    XDG_CACHE_HOME: /tmp
  restart: unless-stopped
  depends_on: [redis]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  networks: [internal]

services:
  api:
    <<: *app
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    pull_policy: never   # uses the image the api service builds
    command: ["node", "dist/worker.js"]
    depends_on:
      redis: { condition: service_started }
      ml: { condition: service_healthy }

  ml:
    image: hirelens-ml:${APP_REVISION:?set APP_REVISION}
    build:
      context: ..
      dockerfile: apps/ml-service/Dockerfile.server
    # production.env: DATABASE_URL and ML_SERVICE_TOKEN. ml.env: the model provider key, which
    # only this service receives.
    env_file: [production.env, ml.env]
    environment:
      APP_ENV: production
      MODEL_BACKEND: hosted
      HOME: /tmp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
    expose: ["8000"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  migrate:
    image: hirelens-migrate:${APP_REVISION:?set APP_REVISION}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    env_file: production.env
    profiles: [release]
    restart: "no"
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  # Traces: API -> queue -> worker -> ML service -> model provider, kept in memory (the newest
  # traces only; nothing survives a restart). Spans hold ids, timings, token counts and costs,
  # never documents. The UI listens on this VM's loopback only; open it through an SSH tunnel:
  #   ssh -L 16686:127.0.0.1:16686 ubuntu@<vm>   then visit http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.16.0
    ports: ["127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"]
    expose: ["4318"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    networks: [internal]

  # TLS termination with automatic certificates. Point API_DOMAIN's DNS at this VM first.
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN, e.g. api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [api]
    networks:
      # Fixed address so the API can trust exactly this proxy (TRUST_PROXY) and nothing else.
      internal: { ipv4_address: 172.28.0.10 }

networks:
  internal:
    ipam:
      config: [{ subnet: 172.28.0.0/24 }]

volumes:
  caddy_data:
  caddy_config:
